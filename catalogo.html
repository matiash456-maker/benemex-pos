<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Benemex Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
    
    header { text-align: center; padding: 35px 20px; background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%); border-bottom: 1px solid #1e293b; }
    header img { max-width: 280px; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin-bottom: 15px; }
    header h1 { font-size: 1.8rem; color: #e9d5ff; margin-bottom: 5px; }
    header p { color: #94a3b8; font-size: 0.95rem; }

    main { max-width: 1200px; margin: 0 auto; padding: 25px 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 200px; object-fit: cover; background: #020617; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
    .card-price { font-size: 1.3rem; font-weight: 700; color: #c084fc; margin-top: auto; }

    footer { text-align: center; padding: 35px 20px; margin-top: 50px; background: #020617; border-top: 1px solid #1e293b; }
    footer h3 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1.5px; color: #c084fc; margin-bottom: 20px; text-transform: uppercase; }
    .contact-links { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
    .contact-btn { padding: 12px 24px; border-radius: 30px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; transition: transform 0.2s, box-shadow 0.2s; }
    .contact-btn:hover { transform: translateY(-2px); }
    .btn-ig { background: #2e1065; color: #f472b6; border: 1px solid #7e22ce; box-shadow: 0 4px 15px rgba(126, 34, 206, 0.3); }
    .btn-wa { background: #064e3b; color: #4ade80; border: 1px solid #16a34a; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3); }
  </style>
</head>
<body>

  <!-- PORTADA DEL CATÁLOGO -->
  <header>
    <img src="logo-home-cut.jpg" alt="Benemex Home Logo">
    <h1>Catálogo de Productos</h1>
    <p>Precios y stock disponible siempre actualizados</p>
  </header>

  <main>
    <div id="catalogo-grid" class="grid">
      <!-- Se carga dinámicamente desde /api/productos -->
    </div>
  </main>

  <!-- CANALES DE CONTACTO AL FINAL DEL CATÁLOGO -->

    </div>
  </footer>

  <script>
    async function cargarCatalogo() {
      const res = await fetch('/api/productos');
      const prods = await res.json();
      const grid = document.getElementById('catalogo-grid');
      grid.innerHTML = prods.map(p => `
        <div class="card">
          <img src="${p.imagen || 'placeholder.png'}" alt="${p.nombre}">
          <div class="card-body">
            <div class="card-title">${p.nombre}</div>
            <div class="card-price">$${p.precio.toLocaleString('es-AR', {minimumFractionDigits: 2})}</div>
          </div>
        </div>
      `).join('');
    }
    cargarCatalogo();
  </script>
</body>
</html>
