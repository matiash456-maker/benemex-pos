<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos - BENEMEX</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; color: #333; padding: 15px; }
    
    header { background-color: #2c3e50; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    header img { max-width: 180px; height: auto; border-radius: 6px; margin-bottom: 10px; }
    header h1 { font-size: 1.6rem; margin-bottom: 5px; }
    
    .filter-card { background: white; padding: 18px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    .btn-clear { padding: 10px 15px; background: #f39c12; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-clear:hover { background: #d35400; }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-3px); }
    
    .img-container { width: 100%; height: 180px; background: #eef2f5; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .no-img { font-size: 3rem; color: #bdc3c7; }
    
    .product-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-category { font-size: 0.78rem; color: #7f8c8d; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
    .product-title { font-size: 1.05rem; font-weight: bold; color: #2c3e50; margin-bottom: 12px; line-height: 1.3; }
    
    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: bold; color: white; text-align: center; width: max-content; }
    .badge-disponible { background-color: #27ae60; }
    .badge-pocas { background-color: #e67e22; }
    .badge-agotado { background-color: #e74c3c; }
    
    .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: #7f8c8d; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <img src="logo-home-cut.jpg" alt="Benemex Logo">
    <h1>Catálogo de Productos - BENEMEX</h1>
    <p style="font-size: 0.9rem; color: #bdc3c7;">Consulta la disponibilidad de nuestros artículos en tiempo real</p>
  </header>

  <div class="filter-card">
    <div class="filter-grid">
      <div class="form-group">
        <label for="search-name">Buscar por nombre de producto:</label>
        <input type="text" id="search-name" placeholder="Escribe para buscar..." oninput="filtrarProductos()">
      </div>
      <div class="form-group">
        <label for="filter-category">Filtrar por categoría:</label>
        <select id="filter-category" onchange="filtrarProductos()">
          <option value="">Todas las categorías</option>
          <option value="Hogar">Hogar</option>
          <option value="Anime/Juguetes">Anime/Juguetes</option>
          <option value="Ropa">Ropa</option>
        </select>
      </div>
      <div>
        <button class="btn-clear" onclick="limpiarFiltros()">Limpiar Filtros</button>
      </div>
    </div>
  </div>

  <div id="catalog-grid" class="catalog-grid">
    <!-- Carga dinámica de productos -->
  </div>

  <script>
    const API = '/api';
    let productosMemoria = [];

    function parseImg(url) { 
      if (!url) return ''; 
      const match = url.match(/[-\w]{25,}/); 
      return match ? `https://lh3.googleusercontent.com/d/${match[0]}` : url; 
    }

    async function cargarCatalogo() {
      try {
        const res = await fetch(`${API}/productos`);
        productosMemoria = await res.json();
        filtrarProductos();
      } catch (err) {
        console.error('Error al cargar productos:', err);
        document.getElementById('catalog-grid').innerHTML = '<div class="no-results">Error al conectar con el catálogo. Por favor, reintente en unos momentos.</div>';
      }
    }

    function filtrarProductos() {
      const qNombre = document.getElementById('search-name').value.toLowerCase().trim();
      const qCat = document.getElementById('filter-category').value;

      const filtrados = productosMemoria.filter(p => {
        const coincideNombre = p.nombre.toLowerCase().includes(qNombre);
        const coincideCat = qCat === '' || p.categoria === qCat;
        return coincideNombre && coincideCat;
      });

      renderGrid(filtrados);
    }

    function limpiarFiltros() {
      document.getElementById('search-name').value = '';
      document.getElementById('filter-category').value = '';
      filtrarProductos();
    }

    function renderGrid(productos) {
      const container = document.getElementById('catalog-grid');
      container.innerHTML = '';

      if (productos.length === 0) {
        container.innerHTML = '<div class="no-results">No se encontraron productos que coincidan con la búsqueda.</div>';
        return;
      }

      productos.forEach(p => {
        let badgeHtml = '';
        if (p.stock > 4) {
          badgeHtml = '<span class="badge badge-disponible">Disponible</span>';
        } else if (p.stock > 0 && p.stock <= 4) {
          badgeHtml = '<span class="badge badge-pocas">Pocas Unidades</span>';
        } else {
          badgeHtml = '<span class="badge badge-agotado">Agotado</span>';
        }

        const imgHtml = p.imagen 
          ? `<img src="${parseImg(p.imagen)}" alt="${p.nombre}" class="product-img" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'no-img\'>📷</span>';">`
          : '<span class="no-img">📷</span>';

        container.innerHTML += `
          <div class="product-card">
            <div class="img-container">
              ${imgHtml}
            </div>
            <div class="product-info">
              <div>
                <div class="product-category">${p.categoria || 'General'}</div>
                <div class="product-title">${p.nombre}</div>
              </div>
              <div style="margin-top: 10px;">
                ${badgeHtml}
              </div>
            </div>
          </div>
        `;
      });
    }

    cargarCatalogo();
  </script>
</body>
</html>
